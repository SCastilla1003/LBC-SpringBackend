# =====================================================================
# LBC API - configuración base (producción / Railway).
# Todos los valores sensibles vienen de variables de entorno.
# Para desarrollo local usa el perfil "local": --spring.profiles.active=local
# =====================================================================
spring.application.name=lbc-api
server.port=${PORT:8080}
# Railway termina TLS en su proxy: respeta X-Forwarded-*
server.forward-headers-strategy=framework

# --- MySQL (Railway crea MYSQLHOST, MYSQLPORT, MYSQLUSER, MYSQLPASSWORD, MYSQLDATABASE) ---
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:lbc}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

# Las tablas las crea y cambia solo Flyway (db/migration); Hibernate no toca el esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Predicción: servicio Python desplegado aparte en Railway (vacío = no disponible) ---
lbc.prediccion.url=${PREDICCION_URL:}

# --- JWT ---
# Clave HMAC de al menos 32 caracteres
lbc.jwt.secreto=${JWT_SECRET}
lbc.jwt.expiracion=${JWT_EXPIRACION:PT24H}
lbc.jwt.emisor=lbc-api

# --- Login con Google (ID tokens). Client IDs separados por comas (web, Android) ---
lbc.google.client-ids=${GOOGLE_CLIENT_IDS:}

# --- CORS: orígenes separados por comas; admite patrones como http://localhost:* ---
lbc.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:}

# --- Usuario administrador inicial ---
lbc.admin.usuario=${ADMIN_USERNAME:adminlbc}
lbc.admin.password=${ADMIN_PASSWORD:}

# Zona horaria con la que se interpretan fechas y horas de los partidos
lbc.zona-horaria=${LBC_ZONA_HORARIA:America/Bogota}

# --- Subida de fotos (único límite de la app) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# --- Bucket de fotos (Railway Storage Bucket, compatible con S3) ---
# Railway crea estas variables en el bucket; enlázalas al servicio de la API.
# Sin ellas la API funciona, pero subir fotos responde SERVICIO_NO_DISPONIBLE.
lbc.bucket.nombre=${BUCKET:}
lbc.bucket.access-key=${ACCESS_KEY_ID:}
lbc.bucket.secret-key=${SECRET_ACCESS_KEY:}
lbc.bucket.region=${REGION:auto}
lbc.bucket.endpoint=${ENDPOINT:}

# --- Actuator: solo health ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Errores JSON propios (ApiError); sin páginas HTML
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false
